<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratings and Reviews</title>
</head>
<body>
    <h1>Ratings and Reviews</h1>
    <main>
        <section>
            <form id="reviewform">
                <p>
                    <label for="mediaTitle">Title</label>
                    <input type="text" id="mediaTitle" name="mediaTitle" required>
                </p>
                <p>
                    <label>Rating</label>
                    <fieldset>
                        <input type="radio" id="star5" name="starRating" value="5" required><label for="star5">★</label>
                        <input type="radio" id="star4" name="starRating" value="4"><label for="star4">★</label>
                        <input type="radio" id="star3" name="starRating" value="3"><label for="star3">★</label>
                        <input type="radio" id="star2" name="starRating" value="2"><label for="star2">★</label>
                        <input type="radio" id="star1" name="starRating" value="1"><label for="star1">★</label>
                        
                    </fieldset>
                </p>
                <p>
                    <label for="critiqueMessage">Review</label>
                    <textarea id="critiqueMessage" rows="4" required></textarea>
                </p>
                <button type="submit" class="btn">Publish</button>
            </form>
        </section>
        <section id="feedContainer">
            <article>
                <header>
                    <h3>Interstellar</h3>
                    <time>Just now</time>
                </header>
                <span class="stars">★★★★★</span>
                <p class="body">Cinematic masterpiece. The score by Hans Zimmer elevates every single frame.</p>
            </article>
        </section>
    </main>
</body>
</body>
</html>
