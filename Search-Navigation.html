<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <br><br>
    <h3>Browse by Title:</h3>
<p>
    <a href="#A">A</a> | <a href="#B">B</a> | <a href="#C">C</a> | <a href="#D">D</a> | 
    <a href="#E">E</a> | <a href="#F">F</a> | <a href="#G">G</a> | <a href="#H">H</a> | 
    <a href="#Z">Z</a> | <a href="#0-9">0-9</a>
</p>
    <br><br>
    <search>
        <form action="/search" method="get" class="search-form">
            <label for="site-search" class="visually-hidden">Search movies</label>
            <input
                type="search"
                id="site-search"
                name="q"
                placeholder="movie name"
                aria-label="Search through site content">
    <br><br>
</form>
<label>Type:</label>
    <input type="radio" id="all" name="type" value="all" checked>
    <label for="all">All</label>
    <input type="radio" id="movies" name="type" value="movie">
    <label for="movies">Movies</label>
    <input type="radio" id="tv" name="type" value="tv">
    <label for="tv">TV Shows</label>

    <br><br>
    <label for="genre">Genre:</label>
    <select id="genre" name="genre">
        <option value="">--Select Genre--</option>
        <option value="action">Action</option>
        <option value="comedy">Comedy</option>
        <option value="drama">Drama</option>
        <option value="sci-fi">Sci-Fi</option>
        <option value="thriller">Thriller</option>
    </select>

    <br><br>
    <label for="year">Release Year:</label>
    <input type="number" id="year" name="year" min="1900" max="2026" placeholder="YYYY">

    <br><br>

    <button type="submit">Search</button>
    
</body>
</html>
