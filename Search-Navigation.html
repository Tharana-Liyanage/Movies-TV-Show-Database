<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="black" text="white"><center>
    <img src="assets\money-rainbow-logo-design_474888-2243.avif" width="100" alt="">
    <h3>BLACK DRAGON MOVIES</h3>
    <br><br>
    <search>
        <form action="/search" method="get" class="search-form">
            <label for="site-search" class="visually-hidden">Search movies</label>
            <input
                type="search"
                id="site-search"
                name="q"
                placeholder="movie name"
                aria-label="Search through site content">
    <br><br>
</form>
<label>Type:</label>
    <input type="radio" id="all" name="type" value="all" checked>
    <label for="all">All</label>
    <input type="radio" id="movies" name="type" value="movie">
    <label for="movies">Movies</label>
    <input type="radio" id="tv" name="type" value="tv">
    <label for="tv">TV Shows</label>

    <br><br>
    <label for="genre">Genre:</label>
    <select id="genre" name="genre">
        <option value="">--Select Genre--</option>
        <option value="action">Action</option>
        <option value="comedy">Comedy</option>
        <option value="drama">Drama</option>
        <option value="sci-fi">Sci-Fi</option>
        <option value="thriller">Thriller</option>
    </select>

    <br><br>
    <label for="year">Release Year:</label>
    <input type="number" id="year" name="year" min="1960" max="2026" placeholder="YYYY">

    <br><br>

    <button type="submit">Search</button>
  </center>  
</body>
</html>
